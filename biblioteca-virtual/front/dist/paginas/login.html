<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/styles.css" />
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 16px;">
        <div class="text-center mb-4">
            <div class="logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem; background: #F5A623; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-book-half" style="color:#1E2A4A;"></i>
            </div>
            <h3 class="fw-bold" style="color: #1E2A4A;">Iniciar Sesión</h3>
            <p class="text-muted small">Acceda a su cuenta de BiblioVirtual</p>
        </div>
        <form action="../../../api/auth.php" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label small fw-bold">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn w-100 py-2 mt-2" style="background: #F5A623; color: #1E2A4A; font-weight: 700;">Ingresar</button>
        </form>

        <div class="text-center mt-3">
            <a href="../../index.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Volver al inicio</a>
        </div>
    </div>
</body>
</html>
